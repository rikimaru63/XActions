<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>コンソール - XActions</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      --bg: #000;
      --surface: #0f1419;
      --surface-2: #16181c;
      --line: #2f3336;
      --line-soft: #202327;
      --text: #e7e9ea;
      --muted: #8b98a5;
      --accent: #1d9bf0;
      --accent-soft: rgba(29, 155, 240, 0.14);
      --green: #00ba7c;
      --yellow: #ffb84d;
      --red: #f4212e;
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    a { color: inherit; }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 244px minmax(360px, 1fr) minmax(340px, 420px);
    }

    .rail,
    .detail {
      border-color: var(--line);
      background: var(--bg);
    }

    .rail {
      border-right: 1px solid var(--line);
      padding: 16px 12px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 10px 18px;
      font-weight: 800;
      font-size: 20px;
    }

    .account {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      margin: 0 4px 14px;
      background: var(--surface);
    }

    .account-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .account-name {
      font-weight: 750;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .account-state {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .account-list,
    .account-picker {
      display: grid;
      gap: 8px;
    }

    .account-item,
    .account-choice {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 9px 10px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 9px;
      align-items: center;
      background: var(--bg);
    }

    .account-item input,
    .account-choice input {
      width: 16px;
      min-height: 16px;
    }

    .account-meta {
      min-width: 0;
    }

    .account-meta strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }

    .account-meta span {
      color: var(--muted);
      font-size: 12px;
    }

    .account-form {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .account-form textarea {
      min-height: 86px;
    }

    .account-management,
    .account-manage-list {
      display: grid;
      gap: 12px;
    }

    .readiness-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 12px;
      background: var(--surface);
      display: grid;
      gap: 5px;
      font-size: 12px;
      line-height: 1.5;
    }

    .readiness-card.ready {
      border-color: rgba(0, 186, 124, 0.5);
      background: rgba(0, 186, 124, 0.06);
    }

    .readiness-card.pending {
      border-color: rgba(255, 184, 77, 0.45);
      background: rgba(255, 184, 77, 0.06);
    }

    .readiness-card strong {
      font-size: 13px;
    }

    .readiness-card span {
      color: var(--muted);
    }

    .account-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      background: var(--surface);
      display: grid;
      gap: 10px;
    }

    .account-card-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .account-card-title {
      min-width: 0;
    }

    .account-card-title strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 15px;
    }

    .account-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .account-actions button,
    .inline-form button {
      min-height: 34px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      padding: 0 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .account-actions .danger {
      color: #ff818a;
      border-color: rgba(244, 33, 46, 0.45);
      background: rgba(244, 33, 46, 0.08);
    }

    .inline-form {
      display: grid;
      gap: 8px;
    }

    .account-tools {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
    }

    .nav {
      display: grid;
      gap: 2px;
    }

    .nav button {
      width: 100%;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      text-align: left;
    }

    .nav button:hover,
    .nav button.active {
      background: var(--surface-2);
    }

    .count {
      color: var(--muted);
      font-size: 12px;
    }

    .main {
      min-width: 0;
      border-right: 1px solid var(--line);
    }

    .top {
      height: 64px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: rgba(0, 0, 0, 0.86);
      backdrop-filter: blur(12px);
      z-index: 2;
    }

    h1,
    h2,
    h3 {
      margin: 0;
      line-height: 1.2;
    }

    h1 { font-size: 22px; }
    h2 { font-size: 18px; }
    h3 { font-size: 15px; }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .link-btn,
    .primary,
    .secondary,
    .danger {
      border: 0;
      border-radius: 999px;
      min-height: 40px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-weight: 750;
      cursor: pointer;
      white-space: nowrap;
    }

    .primary { background: var(--accent); color: white; }
    .secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
    .danger { background: rgba(244, 33, 46, 0.14); color: #ff818a; border: 1px solid rgba(244, 33, 46, 0.45); }
    .link-btn { color: var(--accent); background: transparent; padding: 0; min-height: auto; }
    button:disabled { opacity: 0.48; cursor: not-allowed; }

    .search {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--line-soft);
    }

    .search input {
      width: 100%;
      min-height: 44px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      padding: 0 16px;
      outline: none;
    }

    .search input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .feature-list {
      display: grid;
    }

    .feature-row {
      border: 0;
      border-bottom: 1px solid var(--line-soft);
      background: transparent;
      color: var(--text);
      padding: 16px 20px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      text-align: left;
      cursor: pointer;
    }

    .feature-row:hover,
    .feature-row.active {
      background: rgba(231, 233, 234, 0.045);
    }

    .feature-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .feature-summary {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-content: flex-start;
    }

    .badge {
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      padding: 3px 8px;
      height: 24px;
      line-height: 16px;
    }

    .badge.available { color: var(--green); border-color: rgba(0, 186, 124, 0.5); }
    .badge.legacy { color: var(--yellow); border-color: rgba(255, 184, 77, 0.5); }
    .badge.high { color: #ff818a; border-color: rgba(244, 33, 46, 0.45); }
    .badge.disabled { color: var(--muted); border-color: var(--line); }

    .detail {
      height: 100vh;
      position: sticky;
      top: 0;
      overflow: auto;
    }

    .detail-head {
      padding: 20px;
      border-bottom: 1px solid var(--line);
      position: relative;
    }

    .detail-summary {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin: 10px 0 14px;
    }

    .detail-toggle {
      display: none;
      position: absolute;
      top: 12px;
      right: 14px;
      min-height: 34px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--text);
      padding: 0 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--line);
    }

    .tabs button {
      min-height: 44px;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .tabs button.active {
      color: var(--text);
      border-bottom-color: var(--accent);
      font-weight: 750;
    }

    .panel {
      padding: 18px 20px 28px;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      min-height: 42px;
      padding: 10px 12px;
      outline: none;
    }

    textarea {
      min-height: 108px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .check {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--bg);
    }

    .check input {
      width: 18px;
      min-height: 18px;
    }

    .mode {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 6px 0 16px;
    }

    .mode button {
      min-height: 42px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
    }

    .mode button.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .status {
      display: none;
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .status.visible { display: block; }
    .status.ok { color: var(--green); border-color: rgba(0, 186, 124, 0.5); }
    .status.err { color: #ff818a; border-color: rgba(244, 33, 46, 0.45); }

    .history-list {
      display: grid;
      gap: 10px;
    }

    .schedule-list {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .run-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line-soft);
    }

    .run-item {
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      padding: 10px;
      background: var(--bg);
    }

    .schedule-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .schedule-actions button {
      min-height: 34px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      padding: 0 12px;
      cursor: pointer;
    }

    .history-item {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      background: var(--surface);
    }

    .history-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .history-title {
      font-weight: 760;
      font-size: 14px;
    }

    .history-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      padding: 22px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    .confirm-modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.58);
    }

    .confirm-card {
      width: min(420px, 100%);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      padding: 18px;
    }

    .confirm-card h2 {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .confirm-card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .confirm-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    .confirm-actions button {
      width: 100%;
    }

    .hidden { display: none !important; }

    @media (max-width: 1080px) {
      .shell {
        grid-template-columns: 220px minmax(0, 1fr);
      }

      .detail {
        position: fixed;
        inset: auto 0 0 0;
        height: min(82vh, 760px);
        border-top: 1px solid var(--line);
        transform: translateY(calc(100% - 68px));
        transition: transform 0.2s ease;
        z-index: 20;
      }

      .detail.open {
        transform: translateY(0);
      }

      .detail-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .detail-head {
        padding-right: 84px;
      }
    }

    @media (max-width: 720px) {
      .shell {
        grid-template-columns: 1fr;
        padding-bottom: 64px;
      }

      .rail {
        position: fixed;
        inset: auto 0 0 0;
        height: 64px;
        border-right: 0;
        border-top: 1px solid var(--line);
        padding: 6px;
        z-index: 30;
        overflow: auto hidden;
      }

      .brand,
      .account {
        display: none;
      }

      .nav {
        grid-auto-flow: column;
        grid-auto-columns: max-content;
        overflow-x: auto;
      }

      .nav button {
        min-width: 92px;
        justify-content: center;
      }

      .count {
        display: none;
      }

      .main {
        border-right: 0;
      }

      .detail {
        inset: auto 0 64px 0;
        height: min(78vh, calc(100vh - 84px));
      }

      .badges {
        justify-content: flex-start;
      }

      .feature-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <script src="/js/config.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <div class="brand">
        <span>XActions</span>
        <a class="link-btn" href="/classic-dashboard">従来版</a>
      </div>
      <div class="account" id="account-box">
        <div class="account-label">Xアカウント</div>
        <div class="account-name" id="account-name">確認中</div>
        <div class="account-state" id="account-state">-</div>
        <div class="account-list" id="account-list"></div>
        <div class="account-tools">
          <button type="button" class="link-btn" id="toggle-account-form">追加</button>
          <a class="link-btn" href="/classic-dashboard">従来版</a>
        </div>
        <form class="account-form hidden" id="account-form">
          <input id="new-account-username" autocomplete="off" placeholder="@username">
          <textarea id="new-account-cookie" placeholder="X連携情報を貼り付け"></textarea>
          <label class="check">
            <span>デフォルトにする</span>
            <input id="new-account-default" type="checkbox">
          </label>
          <button type="submit" class="secondary">保存</button>
          <div class="status"></div>
        </form>
      </div>
      <nav class="nav" id="category-nav" aria-label="カテゴリ"></nav>
    </aside>

    <main class="main">
      <header class="top">
        <div>
          <h1>コンソール</h1>
        </div>
        <div class="top-actions">
          <a class="secondary" href="/actions">従来の操作</a>
          <a class="primary" href="/console">ホーム</a>
        </div>
      </header>

      <div class="search">
        <input id="feature-search" autocomplete="off" placeholder="機能を検索">
      </div>

      <section class="feature-list" id="feature-list" aria-live="polite">
        <div class="empty">読み込み中</div>
      </section>
    </main>

    <aside class="detail" id="detail">
      <div class="detail-head">
        <button type="button" class="detail-toggle" id="detail-toggle" aria-label="詳細を開く">開く</button>
        <div class="badges" id="detail-badges"></div>
        <h2 id="detail-title">機能を選択</h2>
        <p class="detail-summary" id="detail-summary">左の一覧から機能を選んでください。</p>
      </div>
      <div class="tabs">
        <button type="button" class="active" data-tab="settings">設定</button>
        <button type="button" data-tab="schedule">予約</button>
        <button type="button" data-tab="history">履歴</button>
      </div>

      <section class="panel" id="settings-panel"></section>
      <section class="panel hidden" id="schedule-panel"></section>
      <section class="panel hidden" id="history-panel"></section>
    </aside>
  </div>

  <div class="confirm-modal hidden" id="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <div class="confirm-card">
      <h2 id="confirm-title">確認</h2>
      <p id="confirm-message"></p>
      <div class="confirm-actions">
        <button type="button" class="secondary" id="confirm-cancel">戻る</button>
        <button type="button" class="danger" id="confirm-submit">実行する</button>
      </div>
    </div>
  </div>

  <script>
    const state = {
      catalog: null,
      accounts: [],
      selectedCategory: 'action',
      selectedFeatureId: null,
      selectedTab: 'settings',
      mode: 'dryRun',
      query: '',
      selectedAccountIds: [],
      accountReadiness: null,
      detailOpen: false,
    };

    const MAX_ACCOUNT_SELECTION = 2;

    const els = {
      accountName: document.getElementById('account-name'),
      accountState: document.getElementById('account-state'),
      accountList: document.getElementById('account-list'),
      accountForm: document.getElementById('account-form'),
      toggleAccountForm: document.getElementById('toggle-account-form'),
      newAccountUsername: document.getElementById('new-account-username'),
      newAccountCookie: document.getElementById('new-account-cookie'),
      newAccountDefault: document.getElementById('new-account-default'),
      nav: document.getElementById('category-nav'),
      list: document.getElementById('feature-list'),
      search: document.getElementById('feature-search'),
      detail: document.getElementById('detail'),
      detailToggle: document.getElementById('detail-toggle'),
      detailTitle: document.getElementById('detail-title'),
      detailSummary: document.getElementById('detail-summary'),
      detailBadges: document.getElementById('detail-badges'),
      settingsPanel: document.getElementById('settings-panel'),
      schedulePanel: document.getElementById('schedule-panel'),
      historyPanel: document.getElementById('history-panel'),
      confirmModal: document.getElementById('confirm-modal'),
      confirmTitle: document.getElementById('confirm-title'),
      confirmMessage: document.getElementById('confirm-message'),
      confirmCancel: document.getElementById('confirm-cancel'),
      confirmSubmit: document.getElementById('confirm-submit'),
    };

    const confirmation = {
      resolve: null,
      previousFocus: null,
    };

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      })[char]);
    }

    function selectorValue(value) {
      if (window.CSS?.escape) return CSS.escape(String(value));
      return String(value).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
    }

    function feature() {
      return state.catalog?.features.find((item) => item.id === state.selectedFeatureId) || null;
    }

    function jaStatus(status) {
      return {
        pending: '予約済み',
        queued: '予約済み',
        waiting: '予約済み',
        active: '実行中',
        processing: '実行中',
        completed: '完了',
        failed: '失敗',
        cancelled: '停止',
        paused: '停止中',
        skipped: '見送り',
      }[status] || status || '-';
    }

    function scheduleStatusLabel(status) {
      return {
        active: '予約済み',
        paused: '停止中',
        completed: '完了',
        failed: '失敗',
      }[status] || status || '-';
    }

    function scheduleTypeLabel(type) {
      return {
        once: '1回だけ',
        daily: '毎日',
        weekly: '毎週',
        interval: '指定間隔',
        cron: '詳細指定',
      }[type] || type || '-';
    }

    function statusBadgeClass(status) {
      if (status === 'completed' || status === 'active') return 'available';
      if (status === 'failed' || status === 'expired' || status === 'error') return 'high';
      if (status === 'paused' || status === 'cancelled' || status === 'skipped') return 'disabled';
      return '';
    }

    function accountStatusClass(status) {
      return {
        active: 'available',
        expired: 'high',
        error: 'high',
        disabled: 'disabled',
      }[status] || '';
    }

    function timeText(value) {
      if (!value) return '';
      const date = new Date(value);
      return date.toLocaleString('ja-JP', { dateStyle: 'short', timeStyle: 'short' });
    }

    function fieldValue(field) {
      const el = document.querySelector(`[data-field="${field.key}"]`);
      if (!el) return undefined;
      if (field.type === 'boolean') return el.checked;
      if (field.type === 'number') return Number(el.value);
      return el.value;
    }

    function collectConfig(selected) {
      const config = {};
      for (const field of selected.fields || []) {
        config[field.key] = fieldValue(field);
      }
      return config;
    }

    function setStatus(target, message, type = '') {
      const el = target.querySelector('.status');
      if (!el) return;
      el.textContent = message;
      el.className = `status visible ${type}`;
    }

    function closeConfirmation(result) {
      if (!confirmation.resolve) return;
      const resolve = confirmation.resolve;
      confirmation.resolve = null;
      els.confirmModal.classList.add('hidden');
      resolve(result);
      if (confirmation.previousFocus?.focus) confirmation.previousFocus.focus();
      confirmation.previousFocus = null;
    }

    function requestConfirmation({
      title = '確認',
      message = '',
      confirmText = '実行する',
      cancelText = '戻る',
      tone = 'danger',
    }) {
      if (!els.confirmModal) return Promise.resolve(false);
      if (confirmation.resolve) closeConfirmation(false);

      confirmation.previousFocus = document.activeElement;
      els.confirmTitle.textContent = title;
      els.confirmMessage.textContent = message;
      els.confirmSubmit.textContent = confirmText;
      els.confirmCancel.textContent = cancelText;
      els.confirmSubmit.className = tone === 'primary' ? 'primary' : 'danger';
      els.confirmModal.classList.remove('hidden');
      els.confirmSubmit.focus();

      return new Promise((resolve) => {
        confirmation.resolve = resolve;
      });
    }

    function activeAccounts() {
      return state.accounts.filter((account) => account.status === 'active');
    }

    function liveReadiness() {
      if (state.accountReadiness) return state.accountReadiness;

      const activeCount = activeAccounts().length;
      const remaining = Math.max(MAX_ACCOUNT_SELECTION - activeCount, 0);
      const ready = remaining === 0;

      return {
        ready,
        activeCount,
        totalCount: state.accounts.length,
        title: ready ? '複数アカウント実行の準備完了' : `あと${remaining}件のX連携が必要`,
        detail: ready
          ? `実行可能なX連携が${activeCount}件あります。2件を選択してlive確認できます。`
          : `実行可能なX連携は${activeCount}件です。live検証には2件必要です。`,
        nextAction: ready
          ? '機能を選び、2件のX連携で実行または予約できます。'
          : 'X連携を追加し、確認で連携済みにしてください。',
      };
    }

    function liveReadinessCard(context = '') {
      const readiness = liveReadiness();
      return `
        <div class="readiness-card ${readiness.ready ? 'ready' : 'pending'}" data-live-readiness="${escapeHtml(context)}">
          <strong>${escapeHtml(readiness.title)}</strong>
          <span>${escapeHtml(readiness.detail)}</span>
          <span>${escapeHtml(`次の操作: ${readiness.nextAction}`)}</span>
        </div>
      `;
    }

    function limitAccountSelection(ids) {
      return [...new Set(ids.filter(Boolean))].slice(0, MAX_ACCOUNT_SELECTION);
    }

    function syncSelectedAccounts() {
      const active = activeAccounts();
      const valid = new Set(active.map((account) => account.id));
      state.selectedAccountIds = limitAccountSelection(state.selectedAccountIds.filter((id) => valid.has(id)));
      if (!state.selectedAccountIds.length && active.length) {
        const defaultAccount = active.find((account) => account.isDefault) || active[0];
        state.selectedAccountIds = [defaultAccount.id];
      }
    }

    function collectAccountIds(scope) {
      const checked = [...scope.querySelectorAll('[data-account-choice]:checked')].map((input) => input.value);
      return limitAccountSelection(checked.length ? checked : state.selectedAccountIds);
    }

    function updateAccountChoiceLocks(scope, selector) {
      const inputs = [...scope.querySelectorAll(selector)];
      const selectedCount = inputs.filter((input) => input.checked).length;
      inputs.forEach((input) => {
        if (input.dataset.disabledByStatus === 'true') return;
        input.disabled = !input.checked && selectedCount >= MAX_ACCOUNT_SELECTION;
      });
    }

    function accountQuery(selected) {
      if (!selected?.accountRequired || !state.selectedAccountIds.length) return '';
      return `&accountIds=${encodeURIComponent(state.selectedAccountIds.join(','))}`;
    }

    function renderAccountPicker(selected) {
      if (!selected.accountRequired) return '';
      syncSelectedAccounts();

      if (!activeAccounts().length) {
        return '<div class="empty">Xアカウントを追加すると実行できます。</div>';
      }

      return `
        <div class="field">
          <label>実行アカウント（最大${MAX_ACCOUNT_SELECTION}件）</label>
          <div class="account-picker">
            ${activeAccounts().map((account) => `
              <label class="account-choice">
                <input type="checkbox" data-account-choice value="${escapeHtml(account.id)}" ${state.selectedAccountIds.includes(account.id) ? 'checked' : ''} ${!state.selectedAccountIds.includes(account.id) && state.selectedAccountIds.length >= MAX_ACCOUNT_SELECTION ? 'disabled' : ''}>
                <span class="account-meta">
                  <strong>@${escapeHtml(account.username)}</strong>
                  <span>${account.isDefault ? 'デフォルト' : account.statusLabel}</span>
                </span>
              </label>
            `).join('')}
          </div>
        </div>
      `;
    }

    function bindAccountPicker(scope) {
      scope.querySelectorAll('[data-account-choice]').forEach((input) => {
        input.addEventListener('change', () => {
          const checked = [...scope.querySelectorAll('[data-account-choice]:checked')].map((item) => item.value);
          if (checked.length > MAX_ACCOUNT_SELECTION) {
            input.checked = false;
            setStatus(scope, `実行アカウントは最大${MAX_ACCOUNT_SELECTION}件まで選択できます。`, 'err');
          }
          state.selectedAccountIds = collectAccountIds(scope);
          updateAccountChoiceLocks(scope, '[data-account-choice]');
          const selected = feature();
          if (selected && state.selectedTab === 'schedule') loadSchedules(selected);
          if (selected && state.selectedTab === 'history') loadHistory();
        });
      });
      updateAccountChoiceLocks(scope, '[data-account-choice]');
    }

    function renderAccount() {
      syncSelectedAccounts();

      if (!state.accounts.length) {
        els.accountName.textContent = '未連携';
        els.accountState.innerHTML = '<a href="/classic-dashboard">従来版で連携</a>';
        els.accountList.innerHTML = liveReadinessCard('sidebar');
        return;
      }

      const defaultAccount = state.accounts.find((account) => account.isDefault) || state.accounts[0];
      els.accountName.textContent = `@${defaultAccount.username}`;
      els.accountState.textContent = `${state.accounts.length}件 / ${activeAccounts().length}件が実行可能`;
      els.accountList.innerHTML = `
        ${liveReadinessCard('sidebar')}
        ${state.accounts.map((account) => `
        <label class="account-item">
          <input type="checkbox" data-account-sidebar-choice value="${escapeHtml(account.id)}" ${state.selectedAccountIds.includes(account.id) ? 'checked' : ''} ${account.status !== 'active' ? 'disabled' : ''} ${account.status !== 'active' ? 'data-disabled-by-status="true"' : ''}>
          <span class="account-meta">
            <strong>@${escapeHtml(account.username)}</strong>
            <span>${escapeHtml(account.isDefault ? 'デフォルト' : account.statusLabel)}</span>
          </span>
        </label>
      `).join('')}
      `;
      updateAccountChoiceLocks(els.accountList, '[data-account-sidebar-choice]');

      els.accountList.querySelectorAll('[data-account-sidebar-choice]').forEach((input) => {
        input.addEventListener('change', () => {
          const checked = [...els.accountList.querySelectorAll('[data-account-sidebar-choice]:checked')].map((item) => item.value);
          if (checked.length > MAX_ACCOUNT_SELECTION) {
            input.checked = false;
          }
          state.selectedAccountIds = limitAccountSelection([...els.accountList.querySelectorAll('[data-account-sidebar-choice]:checked')].map((item) => item.value));
          renderDetail();
        });
      });
    }

    function accountActivityText(account) {
      const parts = [];
      if (account.lastVerifiedAt) parts.push(`確認 ${timeText(account.lastVerifiedAt)}`);
      if (account.lastUsedAt) parts.push(`使用 ${timeText(account.lastUsedAt)}`);
      if (account.error) parts.push(account.error);
      return parts.join(' / ') || 'まだ実行履歴はありません';
    }

    function accountGuidance(account) {
      if (!account) return '';
      if (account.status === 'active') return '';
      if (account.status === 'disabled') return '使う場合は再開してください。';
      return '連携情報を更新して確認してください。';
    }

    function nextActionText(message = '', account = null) {
      const text = `${message || ''} ${account?.status || ''} ${account?.error || ''}`.toLowerCase();
      if (/session|auth|cookie|ログイン|連携情報|期限切れ|読み取れ/.test(text)) {
        return '連携情報を更新して確認してください。';
      }
      if (/同じxアカウント|続いている|lock/.test(text)) {
        return '前の実行が終わってから再実行してください。';
      }
      if (/入力|指定|正しく|必要|required|invalid/.test(text)) {
        return '設定を見直してから再実行してください。';
      }
      return '設定と履歴を確認してから再実行してください。';
    }

    function detailWithGuidance(message, account = null) {
      if (!message) return '';
      return `${message} / 次の操作: ${nextActionText(message, account)}`;
    }

    function renderAccountManagement() {
      const addForm = `
        <form class="account-form" id="account-manage-form">
          <div class="field">
            <label for="account-manage-username">Xユーザー名</label>
            <input id="account-manage-username" autocomplete="off" placeholder="@username">
          </div>
          <div class="field">
            <label for="account-manage-cookie">X連携情報</label>
            <textarea id="account-manage-cookie" placeholder="ブラウザから取得したX連携情報を貼り付け"></textarea>
          </div>
          <label class="check">
            <span>デフォルトにする</span>
            <input id="account-manage-default" type="checkbox">
          </label>
          <button type="submit" class="secondary">追加する</button>
        </form>
      `;

      const accountList = state.accounts.length
        ? state.accounts.map((account) => `
          <div class="account-card" data-account-card="${escapeHtml(account.id)}">
            <div class="account-card-top">
              <div class="account-card-title">
                <strong>@${escapeHtml(account.username)}</strong>
                <div class="history-meta">${escapeHtml(account.displayName || account.username)}</div>
              </div>
              <span class="badge ${accountStatusClass(account.status)}">${escapeHtml(account.statusLabel)}</span>
            </div>
            <div class="history-meta">${escapeHtml(account.isDefault ? 'デフォルト / ' : '')}${escapeHtml(accountActivityText(account))}</div>
            ${accountGuidance(account) ? `<div class="history-meta">${escapeHtml(`次の操作: ${accountGuidance(account)}`)}</div>` : ''}
            <div class="account-actions">
              <button type="button" data-account-default="${escapeHtml(account.id)}" ${account.isDefault ? 'disabled' : ''}>デフォルト</button>
              <button type="button" data-account-verify="${escapeHtml(account.id)}">確認</button>
              <button type="button" data-account-toggle="${escapeHtml(account.id)}" data-status="${escapeHtml(account.status)}">${account.status === 'disabled' ? '再開' : '停止'}</button>
              <button type="button" data-account-cookie-toggle="${escapeHtml(account.id)}">連携情報</button>
              <button type="button" class="danger" data-account-delete="${escapeHtml(account.id)}">削除</button>
            </div>
            <form class="inline-form hidden" data-account-cookie-form="${escapeHtml(account.id)}">
              <textarea data-account-cookie-value="${escapeHtml(account.id)}" placeholder="新しいX連携情報を貼り付け"></textarea>
              <button type="submit">更新する</button>
            </form>
          </div>
        `).join('')
        : '<div class="empty">まだXアカウントが登録されていません。</div>';

      els.settingsPanel.innerHTML = `
        <div class="account-management">
          ${liveReadinessCard('management')}
          ${addForm}
          <div class="status"></div>
          <div class="account-manage-list">${accountList}</div>
        </div>
      `;

      document.getElementById('account-manage-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        await addAccount({
          username: document.getElementById('account-manage-username').value,
          sessionCookie: document.getElementById('account-manage-cookie').value,
          isDefault: document.getElementById('account-manage-default').checked,
        }, els.settingsPanel);
      });

      els.settingsPanel.querySelectorAll('[data-account-default]').forEach((button) => {
        button.addEventListener('click', () => setAccountDefault(button.dataset.accountDefault));
      });
      els.settingsPanel.querySelectorAll('[data-account-verify]').forEach((button) => {
        button.addEventListener('click', () => verifyAccount(button.dataset.accountVerify));
      });
      els.settingsPanel.querySelectorAll('[data-account-toggle]').forEach((button) => {
        button.addEventListener('click', () => toggleAccountStatus(button.dataset.accountToggle, button.dataset.status));
      });
      els.settingsPanel.querySelectorAll('[data-account-cookie-toggle]').forEach((button) => {
        button.addEventListener('click', () => {
          const form = els.settingsPanel.querySelector(`[data-account-cookie-form="${selectorValue(button.dataset.accountCookieToggle)}"]`);
          form?.classList.toggle('hidden');
        });
      });
      els.settingsPanel.querySelectorAll('[data-account-cookie-form]').forEach((form) => {
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const accountId = form.dataset.accountCookieForm;
          const textarea = form.querySelector(`[data-account-cookie-value="${selectorValue(accountId)}"]`);
          await updateAccountCookie(accountId, textarea.value);
        });
      });
      els.settingsPanel.querySelectorAll('[data-account-delete]').forEach((button) => {
        button.addEventListener('click', () => deleteAccount(button.dataset.accountDelete));
      });
    }

    function renderNav() {
      els.nav.innerHTML = state.catalog.categories.map((category) => `
        <button type="button" class="${category.id === state.selectedCategory ? 'active' : ''}" data-category="${escapeHtml(category.id)}">
          <span>${escapeHtml(category.title)}</span>
          <span class="count">${category.available}/${category.total}</span>
        </button>
      `).join('');

      els.nav.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => {
          state.selectedCategory = button.dataset.category;
          state.query = '';
          els.search.value = '';
          const first = filteredFeatures()[0];
          state.selectedFeatureId = first?.id || null;
          render();
        });
      });
    }

    function filteredFeatures() {
      const query = state.query.trim().toLowerCase();
      return state.catalog.features.filter((item) => {
        const inCategory = item.category === state.selectedCategory;
        const matches = !query || `${item.title} ${item.summary}`.toLowerCase().includes(query);
        return inCategory && matches;
      });
    }

    function renderList() {
      const items = filteredFeatures();
      if (!items.length) {
        els.list.innerHTML = '<div class="empty">該当する機能がありません。</div>';
        return;
      }

      els.list.innerHTML = items.map((item) => `
        <button type="button" class="feature-row ${item.id === state.selectedFeatureId ? 'active' : ''}" data-feature="${escapeHtml(item.id)}">
          <span>
            <span class="feature-title">${escapeHtml(item.title)}</span>
            <span class="feature-summary">${escapeHtml(item.summary)}</span>
          </span>
          <span class="badges">
            <span class="badge ${escapeHtml(item.status)}">${escapeHtml(item.statusLabel)}</span>
            ${item.accountRequired ? '<span class="badge">X連携</span>' : ''}
            ${item.status === 'available' && item.supportsSchedule ? '<span class="badge">予約</span>' : ''}
          </span>
        </button>
      `).join('');

      els.list.querySelectorAll('.feature-row').forEach((button) => {
        button.addEventListener('click', () => {
          state.selectedFeatureId = button.dataset.feature;
          state.selectedTab = 'settings';
          state.detailOpen = true;
          render();
          loadHistory();
        });
      });
    }

    function renderDetail() {
      const selected = feature();
      if (!selected) {
        els.detailTitle.textContent = '機能を選択';
        els.detailSummary.textContent = '左の一覧から機能を選んでください。';
        els.detailBadges.innerHTML = '';
        els.settingsPanel.innerHTML = '<div class="empty">機能が選択されていません。</div>';
        els.schedulePanel.innerHTML = '';
        els.historyPanel.innerHTML = '';
        return;
      }

      updateDetailSheet();
      els.detailTitle.textContent = selected.title;
      els.detailSummary.textContent = selected.summary;
      els.detailBadges.innerHTML = `
        <span class="badge ${escapeHtml(selected.status)}">${escapeHtml(selected.statusLabel)}</span>
        <span class="badge ${escapeHtml(selected.riskLevel)}">リスク ${escapeHtml(selected.riskLabel)}</span>
        ${selected.accountRequired ? '<span class="badge">X連携が必要</span>' : ''}
      `;

      document.querySelectorAll('.tabs button').forEach((button) => {
        button.classList.toggle('active', button.dataset.tab === state.selectedTab);
      });
      els.settingsPanel.classList.toggle('hidden', state.selectedTab !== 'settings');
      els.schedulePanel.classList.toggle('hidden', state.selectedTab !== 'schedule');
      els.historyPanel.classList.toggle('hidden', state.selectedTab !== 'history');

      renderSettings(selected);
      renderSchedule(selected);
      if (state.selectedTab === 'schedule') loadSchedules(selected);
      if (state.selectedTab === 'history') loadHistory();
    }

    function updateDetailSheet() {
      els.detail.classList.toggle('open', state.detailOpen);
      if (!els.detailToggle) return;
      els.detailToggle.textContent = state.detailOpen ? '閉じる' : '開く';
      els.detailToggle.setAttribute('aria-label', state.detailOpen ? '詳細を閉じる' : '詳細を開く');
    }

    function renderField(field) {
      const value = field.default ?? '';
      if (field.type === 'textarea') {
        return `
          <div class="field">
            <label for="field-${escapeHtml(field.key)}">${escapeHtml(field.label)}</label>
            <textarea id="field-${escapeHtml(field.key)}" data-field="${escapeHtml(field.key)}" maxlength="${field.max || ''}" placeholder="${escapeHtml(field.placeholder || '')}"></textarea>
          </div>
        `;
      }
      if (field.type === 'boolean') {
        return `
          <div class="field">
            <label>${escapeHtml(field.label)}</label>
            <div class="check">
              <span>${field.default ? '有効' : '無効'}</span>
              <input type="checkbox" data-field="${escapeHtml(field.key)}" ${field.default ? 'checked' : ''}>
            </div>
          </div>
        `;
      }
      return `
        <div class="field">
          <label for="field-${escapeHtml(field.key)}">${escapeHtml(field.label)}${field.suffix ? ` (${escapeHtml(field.suffix)})` : ''}</label>
          <input id="field-${escapeHtml(field.key)}"
            data-field="${escapeHtml(field.key)}"
            type="${field.type === 'number' ? 'number' : 'text'}"
            min="${field.min ?? ''}"
            max="${field.max ?? ''}"
            step="${field.step ?? ''}"
            value="${escapeHtml(value)}"
            placeholder="${escapeHtml(field.placeholder || '')}">
        </div>
      `;
    }

    function renderSettings(selected) {
      if (selected.id === 'accounts') {
        renderAccountManagement();
        return;
      }

      if (selected.status !== 'available') {
        const target = selected.page || selected.endpoint || '';
        els.settingsPanel.innerHTML = `
          <div class="empty">この機能は既存の画面またはAPIで利用できます。</div>
          ${target && selected.page ? `<a class="primary" href="${escapeHtml(target)}" style="margin-top:14px;width:100%;">開く</a>` : ''}
          <div class="status"></div>
        `;
        return;
      }

      const disableDryRun = !selected.supportsDryRun;
      if (disableDryRun && state.mode === 'dryRun') state.mode = 'live';

      els.settingsPanel.innerHTML = `
        <div class="field">
          <label>実行方法</label>
          <div class="mode">
            <button type="button" data-mode="dryRun" class="${state.mode === 'dryRun' ? 'active' : ''}" ${disableDryRun ? 'disabled' : ''}>確認のみ</button>
            <button type="button" data-mode="live" class="${state.mode === 'live' ? 'active' : ''}">実行</button>
          </div>
        </div>
        ${renderAccountPicker(selected)}
        ${(selected.fields || []).map(renderField).join('')}
        <button type="button" class="${state.mode === 'live' ? 'danger' : 'primary'}" id="execute-btn" style="width:100%;">
          ${state.mode === 'live' ? '実行する' : '確認のみで実行'}
        </button>
        <div class="status"></div>
      `;

      els.settingsPanel.querySelectorAll('[data-mode]').forEach((button) => {
        button.addEventListener('click', () => {
          state.mode = button.dataset.mode;
          renderSettings(selected);
        });
      });
      bindAccountPicker(els.settingsPanel);

      document.getElementById('execute-btn').addEventListener('click', () => executeFeature(selected));
    }

    function renderSchedule(selected) {
      if (selected.status !== 'available' || !selected.consoleAction) {
        els.schedulePanel.innerHTML = '<div class="empty">この機能に予約設定はありません。</div>';
        return;
      }

      if (!selected.supportsSchedule) {
        els.schedulePanel.innerHTML = '<div class="empty">この機能は予約できません。</div>';
        return;
      }

      const disableDryRun = !selected.supportsDryRun;
      if (disableDryRun && state.mode === 'dryRun') state.mode = 'live';

      els.schedulePanel.innerHTML = `
        <div class="field">
          <label>実行方法</label>
          <div class="mode">
            <button type="button" data-schedule-mode="dryRun" class="${state.mode === 'dryRun' ? 'active' : ''}" ${disableDryRun ? 'disabled' : ''}>確認のみ</button>
            <button type="button" data-schedule-mode="live" class="${state.mode === 'live' ? 'active' : ''}">実行</button>
          </div>
        </div>
        ${renderAccountPicker(selected)}
        <div class="field">
          <label for="schedule-type">予約タイプ</label>
          <select id="schedule-type">
            <option value="once">1回だけ</option>
            <option value="daily">毎日</option>
            <option value="weekly">毎週</option>
            <option value="interval">指定間隔</option>
            <option value="cron">詳細指定</option>
          </select>
        </div>
        <div class="field">
          <label for="schedule-run-at">日時</label>
          <input id="schedule-run-at" type="datetime-local">
        </div>
        <div class="field">
          <label for="schedule-interval-minutes">間隔（分）</label>
          <input id="schedule-interval-minutes" type="number" min="1" max="10080" value="60">
        </div>
        <div class="field">
          <label for="schedule-days-of-week">曜日</label>
          <input id="schedule-days-of-week" placeholder="0,1,2,3,4,5,6">
        </div>
        <div class="field">
          <label for="schedule-cron">詳細指定</label>
          <input id="schedule-cron" placeholder="*/30 * * * *">
        </div>
        <div class="field">
          <label for="schedule-timezone">タイムゾーン</label>
          <input id="schedule-timezone" value="Asia/Tokyo">
        </div>
        <div class="field">
          <label for="schedule-retries">失敗時の再試行</label>
          <input id="schedule-retries" type="number" min="0" max="5" value="2">
        </div>
        <button type="button" class="${state.mode === 'live' ? 'danger' : 'secondary'}" id="schedule-btn" style="width:100%;">予約を保存</button>
        <div class="status"></div>
        <div class="schedule-list" id="schedule-list"></div>
      `;

      els.schedulePanel.querySelectorAll('[data-schedule-mode]').forEach((button) => {
        button.addEventListener('click', () => {
          state.mode = button.dataset.scheduleMode;
          renderSchedule(selected);
        });
      });
      bindAccountPicker(els.schedulePanel);
      document.getElementById('schedule-btn').addEventListener('click', () => scheduleFeature(selected));
    }

    async function executeFeature(selected) {
      const config = collectConfig(selected);
      if (state.mode === 'live') {
        const ok = await requestConfirmation({
          title: '実行前の確認',
          message: `「${selected.title}」を実行します。選択したXアカウントで実際に操作されます。`,
          confirmText: '実行する',
        });
        if (!ok) return;
      }

      const button = document.getElementById('execute-btn');
      button.disabled = true;
      button.textContent = '送信中';

      try {
        const result = await apiRequest('/console/actions/execute', {
          method: 'POST',
          body: JSON.stringify({
            featureId: selected.id,
            accountIds: collectAccountIds(els.settingsPanel),
            mode: state.mode,
            config,
          }),
        });
        setStatus(els.settingsPanel, `実行を受け付けました: ${result.operations?.length || 1}件`, 'ok');
        await loadHistory();
      } catch (error) {
        setStatus(els.settingsPanel, error.message, 'err');
      } finally {
        button.disabled = false;
        button.textContent = state.mode === 'live' ? '実行する' : '確認のみで実行';
      }
    }

    async function scheduleFeature(selected) {
      if (state.mode === 'live') {
        const ok = await requestConfirmation({
          title: '実行予約の確認',
          message: `「${selected.title}」を実行モードで予約します。予約時刻になると選択したXアカウントで実際に操作されます。`,
          confirmText: '予約を保存',
        });
        if (!ok) return;
      }

      try {
        await apiRequest('/console/actions/schedule', {
          method: 'POST',
          body: JSON.stringify({
            featureId: selected.id,
            accountIds: collectAccountIds(els.schedulePanel),
            mode: state.mode,
            config: collectConfig(selected),
            maxRetries: Number(document.getElementById('schedule-retries').value || 2),
            schedule: {
              type: document.getElementById('schedule-type').value,
              runAt: document.getElementById('schedule-run-at').value,
              intervalMinutes: Number(document.getElementById('schedule-interval-minutes').value || 60),
              daysOfWeek: document.getElementById('schedule-days-of-week').value,
              cron: document.getElementById('schedule-cron').value,
              timezone: document.getElementById('schedule-timezone').value,
            },
          }),
        });
        setStatus(els.schedulePanel, '予約を保存しました。', 'ok');
        await loadSchedules(selected);
      } catch (error) {
        setStatus(els.schedulePanel, error.message, 'err');
      }
    }

    async function loadSchedules(selected) {
      const list = document.getElementById('schedule-list');
      if (!list) return;

      list.innerHTML = '<div class="empty">予約を読み込み中</div>';
      try {
        const data = await apiRequest(`/scheduled-actions?featureId=${encodeURIComponent(selected.id)}&limit=10${accountQuery(selected)}`);
        if (!data.schedules.length) {
          list.innerHTML = '<div class="empty">この機能の予約はまだありません。</div>';
          return;
        }

        list.innerHTML = data.schedules.map((schedule) => `
          <div class="history-item" data-schedule-id="${escapeHtml(schedule.id)}">
            <div class="history-top">
              <div>
                <div class="history-title">${escapeHtml(schedule.name)}</div>
                <div class="history-meta">${escapeHtml(schedule.account?.username ? `@${schedule.account.username}` : 'アカウント未指定')} / 次回 ${escapeHtml(timeText(schedule.nextRunAt) || '-')}</div>
              </div>
              <span class="badge ${statusBadgeClass(schedule.status)}">${escapeHtml(scheduleStatusLabel(schedule.status))}</span>
            </div>
            <div class="history-meta">${escapeHtml(scheduleDetail(schedule))}</div>
            ${schedule.lastError ? `<div class="history-meta">${escapeHtml(`失敗理由: ${detailWithGuidance(schedule.lastError, schedule.account)}`)}</div>` : ''}
            <div class="schedule-actions">
              <button type="button" data-run-now="${escapeHtml(schedule.id)}" data-run-mode="${escapeHtml(schedule.mode)}">今すぐ実行</button>
              <button type="button" data-toggle-schedule="${escapeHtml(schedule.id)}" data-status="${escapeHtml(schedule.status)}">${schedule.status === 'paused' ? '再開' : '停止'}</button>
              <button type="button" data-load-runs="${escapeHtml(schedule.id)}">実行履歴</button>
              <button type="button" data-delete-schedule="${escapeHtml(schedule.id)}">削除</button>
            </div>
            <div class="run-list hidden" data-schedule-runs="${escapeHtml(schedule.id)}"></div>
          </div>
        `).join('');

        list.querySelectorAll('[data-run-now]').forEach((button) => {
          button.addEventListener('click', () => runScheduleNow(button.dataset.runNow, selected, button.dataset.runMode));
        });
        list.querySelectorAll('[data-toggle-schedule]').forEach((button) => {
          button.addEventListener('click', () => toggleSchedule(button.dataset.toggleSchedule, button.dataset.status, selected));
        });
        list.querySelectorAll('[data-load-runs]').forEach((button) => {
          button.addEventListener('click', () => loadScheduleRuns(button.dataset.loadRuns));
        });
        list.querySelectorAll('[data-delete-schedule]').forEach((button) => {
          button.addEventListener('click', () => deleteSchedule(button.dataset.deleteSchedule, selected));
        });
      } catch (error) {
        list.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
      }
    }

    function scheduleDetail(schedule) {
      const parts = [
        scheduleTypeLabel(schedule.scheduleType),
        schedule.mode === 'live' ? '実行' : '確認のみ',
        `再試行 ${schedule.failureCount || 0}/${schedule.maxRetries ?? 0}`,
      ];
      if (schedule.lastRunAt) parts.push(`前回 ${timeText(schedule.lastRunAt)}`);
      return parts.filter(Boolean).join(' / ');
    }

    async function loadScheduleRuns(id) {
      const list = document.querySelector(`[data-schedule-runs="${selectorValue(id)}"]`);
      if (!list) return;

      if (!list.classList.contains('hidden') && list.dataset.loaded === 'true') {
        list.classList.add('hidden');
        return;
      }

      list.classList.remove('hidden');
      list.innerHTML = '<div class="empty">実行履歴を読み込み中</div>';
      try {
        const data = await apiRequest(`/scheduled-actions/${encodeURIComponent(id)}/runs?limit=10`);
        list.dataset.loaded = 'true';
        if (!data.runs.length) {
          list.innerHTML = '<div class="empty">まだ実行履歴はありません。</div>';
          return;
        }

        list.innerHTML = data.runs.map((run) => {
          const runStatus = run.operationStatus || run.status;
          const account = run.account?.username ? `@${run.account.username}` : '';
          const operation = run.operationId ? `操作 ${run.operationId.slice(0, 8)}` : '';
          const meta = [`予定 ${timeText(run.scheduledFor) || '-'}`, account, operation].filter(Boolean).join(' / ');
          return `
            <div class="run-item">
              <div class="history-top">
                <div>
                  <div class="history-title">${escapeHtml(jaStatus(runStatus))}</div>
                  <div class="history-meta">${escapeHtml(meta)}</div>
                </div>
                <span class="badge ${statusBadgeClass(runStatus)}">${escapeHtml(run.operationType || '予約')}</span>
              </div>
              <div class="history-meta">${escapeHtml(run.error ? detailWithGuidance(run.error, run.account) : (runResultDetail(run) || runTimeDetail(run)))}</div>
            </div>
          `;
        }).join('');
      } catch (error) {
        list.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
      }
    }

    function runTimeDetail(run) {
      const parts = [];
      if (run.startedAt) parts.push(`開始 ${timeText(run.startedAt)}`);
      if (run.finishedAt) parts.push(`終了 ${timeText(run.finishedAt)}`);
      return parts.join(' / ') || '処理待ち';
    }

    function runResultDetail(run) {
      const result = run.result || run.operation?.result;
      if (!result || typeof result !== 'object' || Array.isArray(result)) return '';
      if (result.batch) return `完了 ${result.completed || 0} / 失敗 ${result.failed || 0} / 全体 ${result.total || 0}`;
      if (typeof result.preview === 'string') return result.preview.slice(0, 120);
      if (typeof result.message === 'string') return result.message.slice(0, 120);
      if (typeof result.count !== 'undefined') return `件数 ${result.count}`;
      if (result.dryRun && result.action) return `確認のみ / ${result.action}`;
      return '';
    }

    async function runScheduleNow(id, selected, mode = 'dryRun') {
      if (mode === 'live') {
        const ok = await requestConfirmation({
          title: '今すぐ実行',
          message: 'この予約を実行モードで開始します。選択済みのXアカウントで実際に操作されます。',
          confirmText: '今すぐ実行',
        });
        if (!ok) return;
      }

      try {
        const result = await apiRequest(`/scheduled-actions/${encodeURIComponent(id)}/run-now`, { method: 'POST' });
        setStatus(
          els.schedulePanel,
          result.skipped ? (result.error || '実行をスキップしました。') : '実行を受け付けました。',
          result.skipped ? 'err' : 'ok'
        );
        await loadSchedules(selected);
        await loadScheduleRuns(id);
        await loadHistory();
      } catch (error) {
        setStatus(els.schedulePanel, error.message, 'err');
      }
    }

    async function toggleSchedule(id, status, selected) {
      try {
        const action = status === 'paused' ? 'resume' : 'pause';
        await apiRequest(`/scheduled-actions/${encodeURIComponent(id)}/${action}`, { method: 'POST' });
        await loadSchedules(selected);
      } catch (error) {
        setStatus(els.schedulePanel, error.message, 'err');
      }
    }

    async function deleteSchedule(id, selected) {
      const ok = await requestConfirmation({
        title: '予約を削除',
        message: 'この予約を削除します。削除後は元に戻せません。',
        confirmText: '削除する',
      });
      if (!ok) return;
      try {
        await apiRequest(`/scheduled-actions/${encodeURIComponent(id)}`, { method: 'DELETE' });
        await loadSchedules(selected);
      } catch (error) {
        setStatus(els.schedulePanel, error.message, 'err');
      }
    }

    async function loadHistory() {
      const selected = feature();
      if (!selected) return;

      els.historyPanel.innerHTML = '<div class="empty">履歴を読み込み中</div>';
      try {
        const data = await apiRequest(`/console/history?featureId=${encodeURIComponent(selected.id)}&limit=10${accountQuery(selected)}`);
        if (!data.operations.length) {
          els.historyPanel.innerHTML = '<div class="empty">この機能の履歴はまだありません。</div>';
          return;
        }
        els.historyPanel.innerHTML = `
          <div class="status"></div>
          <div class="history-list">
            ${data.operations.map((operation) => `
              <div class="history-item">
                <div class="history-top">
                  <div>
                    <div class="history-title">${escapeHtml(jaStatus(operation.status))}</div>
                    <div class="history-meta">${escapeHtml(historyMeta(operation))}</div>
                  </div>
                  <span class="badge ${operation.status === 'completed' ? 'available' : operation.status === 'failed' ? 'high' : ''}">${escapeHtml(operation.type)}</span>
                </div>
                <div class="history-meta">${escapeHtml(historyDetail(operation))}</div>
                ${childOperationSummary(operation)}
                ${canRetryFailed(operation) ? `
                  <div class="schedule-actions">
                    <button type="button" data-retry-failed="${escapeHtml(operation.id)}">失敗分を再実行</button>
                  </div>
                ` : ''}
              </div>
            `).join('')}
          </div>
        `;
        els.historyPanel.querySelectorAll('[data-retry-failed]').forEach((button) => {
          button.addEventListener('click', () => retryFailedAccounts(button.dataset.retryFailed, selected));
        });
      } catch (error) {
        els.historyPanel.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
      }
    }

    function historyMeta(operation) {
      const parts = [];
      if (operation.account?.username) parts.push(`@${operation.account.username}`);
      if (operation.scheduledAction?.name) parts.push(`予約: ${operation.scheduledAction.name}`);
      if (operation.batchId) parts.push('複数アカウント');
      parts.push(timeText(operation.createdAt));
      return parts.filter(Boolean).join(' / ');
    }

    function historyDetail(operation) {
      if (operation.error) return detailWithGuidance(operation.error, operation.account);
      if (operation.result?.batch) {
        return `完了 ${operation.result.completed || 0} / 失敗 ${operation.result.failed || 0} / 全体 ${operation.result.total || 0}`;
      }
      return summarizeConfig(operation.config) || '処理待ち';
    }

    function childOperationSummary(operation) {
      if (!operation.childOperations?.length) return '';
      return `
        <div class="history-meta">
          ${operation.childOperations.map((child) => {
            const account = child.account?.username ? `@${child.account.username}` : 'アカウント未指定';
            const error = child.error ? ` / ${detailWithGuidance(child.error, child.account)}` : '';
            return escapeHtml(`${account}: ${jaStatus(child.status)}${error}`);
          }).join('<br>')}
        </div>
      `;
    }

    function canRetryFailed(operation) {
      return operation.config?.isBatch
        && operation.status === 'failed'
        && operation.childOperations?.some((child) => child.status === 'failed');
    }

    function summarizeConfig(config) {
      if (!config) return '';
      if (config.targetUsername) return `@${config.targetUsername}`;
      if (config.username) return `@${config.username}`;
      if (config.tweetUrl) return config.tweetUrl;
      if (config.query) return config.query;
      return '';
    }

    async function retryFailedAccounts(parentOperationId, selected) {
      if (state.mode === 'live') {
        const ok = await requestConfirmation({
          title: '再実行の確認',
          message: '失敗したアカウントだけを実行モードで再実行します。',
          confirmText: '再実行する',
        });
        if (!ok) return;
      }

      try {
        const result = await apiRequest('/console/actions/retry-failed', {
          method: 'POST',
          body: JSON.stringify({
            parentOperationId,
            featureId: selected.id,
            mode: state.mode,
            config: collectConfig(selected),
          }),
        });
        setStatus(els.historyPanel, `再実行を受け付けました: ${result.retriedAccountCount || 0}件`, 'ok');
        await loadHistory();
      } catch (error) {
        setStatus(els.historyPanel, error.message, 'err');
      }
    }

    function render() {
      renderAccount();
      renderNav();
      renderList();
      renderDetail();
    }

    async function loadAccounts() {
      const accountData = await apiRequest('/console/accounts');
      state.accounts = accountData.accounts || [];
      state.accountReadiness = accountData.liveReadiness || null;
      syncSelectedAccounts();
    }

    async function addAccount(payload, target) {
      setStatus(target, '保存中');

      try {
        await apiRequest('/accounts', {
          method: 'POST',
          body: JSON.stringify(payload),
        });
        await loadAccounts();
        render();
        setStatus(target, '保存しました。', 'ok');
      } catch (error) {
        setStatus(target, error.message, 'err');
      }
    }

    async function setAccountDefault(accountId) {
      try {
        await apiRequest(`/accounts/${encodeURIComponent(accountId)}/default`, { method: 'POST' });
        await loadAccounts();
        render();
        setStatus(els.settingsPanel, 'デフォルトを更新しました。', 'ok');
      } catch (error) {
        setStatus(els.settingsPanel, error.message, 'err');
      }
    }

    async function verifyAccount(accountId) {
      setStatus(els.settingsPanel, '確認中');
      try {
        const result = await apiRequest(`/accounts/${encodeURIComponent(accountId)}/verify`, { method: 'POST' });
        await loadAccounts();
        render();
        setStatus(els.settingsPanel, result.verified ? 'ログイン状態を確認しました。' : 'ログイン状態を確認できませんでした。', result.verified ? 'ok' : 'err');
      } catch (error) {
        setStatus(els.settingsPanel, error.message, 'err');
      }
    }

    async function toggleAccountStatus(accountId, currentStatus) {
      const nextStatus = currentStatus === 'disabled' ? 'active' : 'disabled';
      try {
        await apiRequest(`/accounts/${encodeURIComponent(accountId)}`, {
          method: 'PATCH',
          body: JSON.stringify({ status: nextStatus }),
        });
        await loadAccounts();
        render();
        setStatus(els.settingsPanel, nextStatus === 'disabled' ? '停止しました。' : '再開しました。', 'ok');
      } catch (error) {
        setStatus(els.settingsPanel, error.message, 'err');
      }
    }

    async function updateAccountCookie(accountId, sessionCookie) {
      if (!String(sessionCookie || '').trim()) {
        setStatus(els.settingsPanel, 'X連携情報を入力してください。', 'err');
        return;
      }

      setStatus(els.settingsPanel, '更新中');
      try {
        await apiRequest(`/accounts/${encodeURIComponent(accountId)}`, {
          method: 'PATCH',
          body: JSON.stringify({ sessionCookie }),
        });
        await loadAccounts();
        render();
        setStatus(els.settingsPanel, '連携情報を更新しました。', 'ok');
      } catch (error) {
        setStatus(els.settingsPanel, error.message, 'err');
      }
    }

    async function deleteAccount(accountId) {
      const ok = await requestConfirmation({
        title: 'Xアカウントを削除',
        message: 'このXアカウントを削除します。有効な予約は停止されます。',
        confirmText: '削除する',
      });
      if (!ok) return;
      try {
        await apiRequest(`/accounts/${encodeURIComponent(accountId)}`, { method: 'DELETE' });
        await loadAccounts();
        render();
        setStatus(els.settingsPanel, '削除しました。', 'ok');
      } catch (error) {
        setStatus(els.settingsPanel, error.message, 'err');
      }
    }

    async function init() {
      if (!localStorage.getItem('authToken')) {
        window.location.href = '/login';
        return;
      }

      try {
        const [catalog] = await Promise.all([
          apiRequest('/console/features'),
          loadAccounts(),
        ]);

        state.catalog = catalog;
        state.selectedFeatureId = catalog.features.find((item) => item.category === state.selectedCategory && item.status === 'available')?.id
          || catalog.features.find((item) => item.category === state.selectedCategory)?.id
          || catalog.features[0]?.id;

        render();
        loadHistory();
      } catch (error) {
        els.list.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
      }
    }

    els.search.addEventListener('input', () => {
      state.query = els.search.value;
      renderList();
    });

    els.toggleAccountForm.addEventListener('click', () => {
      els.accountForm.classList.toggle('hidden');
    });

    els.accountForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      await addAccount({
        username: els.newAccountUsername.value,
        sessionCookie: els.newAccountCookie.value,
        isDefault: els.newAccountDefault.checked,
      }, els.accountForm);

      if (els.accountForm.querySelector('.status').classList.contains('ok')) {
        els.newAccountUsername.value = '';
        els.newAccountCookie.value = '';
        els.newAccountDefault.checked = false;
      }
    });

    els.confirmCancel.addEventListener('click', () => closeConfirmation(false));
    els.confirmSubmit.addEventListener('click', () => closeConfirmation(true));
    els.confirmModal.addEventListener('click', (event) => {
      if (event.target === els.confirmModal) closeConfirmation(false);
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !els.confirmModal.classList.contains('hidden')) {
        closeConfirmation(false);
      }
    });

    document.querySelectorAll('.tabs button').forEach((button) => {
      button.addEventListener('click', () => {
        state.selectedTab = button.dataset.tab;
        state.detailOpen = true;
        renderDetail();
      });
    });

    els.detailToggle?.addEventListener('click', () => {
      state.detailOpen = !state.detailOpen;
      updateDetailSheet();
    });

    init();
  </script>
</body>
</html>
